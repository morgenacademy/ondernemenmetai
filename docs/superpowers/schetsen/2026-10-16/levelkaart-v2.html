<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jouw route · Ondernemen met AI</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --purple: #5B2D8E; --purple-light: #9B6FCF; --accent: #D8FE56; --bg: #0C0818; --text: #F0ECF5; --text-2: #D8CCEC; --muted: #BAAED0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Barlow', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 28px; position: absolute; top: 0; left: 0; right: 0; z-index: 5; }
  .logo { font-weight: 900; font-size: 22px; color: #fff; } .logo em { color: var(--accent); font-style: normal; }
  .top a { color: var(--text-2); font-size: 14px; font-weight: 600; text-decoration: none; background: rgba(12,8,24,.55); border: 1px solid rgba(255,255,255,.16); padding: 7px 12px; border-radius: 12px; backdrop-filter: blur(8px); }
  .top a:hover { color: #fff; border-color: rgba(255,255,255,.35); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }

  .kaart { position: relative; width: 100%; aspect-ratio: 1536 / 640; overflow: hidden; }
  .laag { position: absolute; left: 0; width: 100%; aspect-ratio: 1536 / 1024; top: -51%; }
  /* Op een telefoon: inzoomen op het stuk met het pad (44% tot 91% van de breedte) */
  @media (max-width: 700px) { .kaart { aspect-ratio: 1 / .833; } .laag { width: 200%; left: -88%; } }
  .laag img.plaat { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .kaart::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(0deg, var(--bg) 0%, rgba(12,8,24,0) 22%), linear-gradient(180deg, rgba(12,8,24,.7) 0%, rgba(12,8,24,0) 25%); }

  .halte { position: absolute; transform: translate(-50%, -50%); border: 0; padding: 0; background: none; cursor: pointer; z-index: 3; }
  .halte .ring { display: block; width: var(--d); height: var(--d); border-radius: 99px; border: 2px solid transparent; transition: .3s; }
  .halte.af .ring { border-color: rgba(216,254,86,.9); box-shadow: 0 0 18px rgba(216,254,86,.55); }
  .halte.nu .ring { border-color: var(--accent); animation: puls 1.8s ease-out infinite; }
  .halte.dicht .ring { background: rgba(12,8,24,.55); border-color: rgba(255,255,255,.25); }
  .halte.gekozen .ring { outline: 3px solid #fff; outline-offset: 3px; }
  @keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(216,254,86,.7); } 100% { box-shadow: 0 0 0 16px rgba(216,254,86,0); } }
  .halte .kaartje { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 14px; font-weight: 700; color: #fff; background: rgba(12,8,24,.72); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(8px); padding: 5px 10px; border-radius: 10px; display: flex; gap: 6px; align-items: center; }
  .halte .kaartje.rechts { left: calc(100% + 10px); } .halte .kaartje.links { right: calc(100% + 10px); }
  .halte .kaartje .nr { color: var(--accent); font-weight: 900; }
  .halte.dicht .kaartje, .halte.dicht .kaartje .nr { color: var(--muted); }
  .halte:hover .kaartje, .halte:focus-visible .kaartje { border-color: var(--accent); }
  .halte:focus-visible { outline: none; } .halte:focus-visible .ring { outline: 3px solid var(--accent); outline-offset: 3px; }

  .jij { position: absolute; z-index: 2; transform: translate(-50%, -100%); transition: left 2.2s cubic-bezier(.45,0,.2,1), top 2.2s cubic-bezier(.45,0,.2,1), height 2.2s cubic-bezier(.45,0,.2,1); pointer-events: none; filter: drop-shadow(0 0 6px rgba(216,254,86,.55)) drop-shadow(0 6px 8px rgba(0,0,0,.45)); }

  .onder { max-width: 1100px; margin: -30px auto 0; padding: 0 28px 70px; position: relative; z-index: 4; }
  .level-titel { font-weight: 900; font-size: clamp(40px, 5vw, 68px); line-height: .95; color: #fff; margin: 8px 0 12px; }
  .samenvatting { color: var(--text-2); font-size: 19px; line-height: 1.45; margin: 0 0 12px; max-width: 52ch; }
  .mijlpaal { color: var(--text-2); border-left: 3px solid var(--accent); padding-left: 12px; max-width: 60ch; margin: 0; }
  .knop { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; background: linear-gradient(135deg, var(--accent), #b8e040); color: #1A1A2E; font: 800 18px 'Barlow', sans-serif; padding: 15px 28px; border-radius: 20px; text-decoration: none; box-shadow: 0 6px 30px rgba(216,254,86,.35); border: 0; cursor: pointer; }
  .knop:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .slot-uitleg { margin-top: 22px; color: var(--muted); font-size: 16px; }
  .gevierd { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 30px); opacity: 0; z-index: 9; background: var(--accent); color: #1A1A2E; font-weight: 800; font-size: 17px; padding: 14px 22px; border-radius: 16px; box-shadow: 0 10px 40px rgba(216,254,86,.4); transition: .6s; }
  .gevierd.aan { opacity: 1; transform: translate(-50%, 0); }
  details.demo { margin-top: 40px; font-size: 14px; color: var(--muted); }
  details.demo summary { cursor: pointer; }
  details.demo .rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  details.demo button { font: 700 14px 'Barlow'; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  details.demo button.aan { background: var(--accent); color: #1A1A2E; border-color: var(--accent); }
  /* Rustig beeld: alleen je huidige en je gekozen level hebben een label; de rest verschijnt bij aanwijzen */
  .halte .kaartje { opacity: 0; pointer-events: none; transition: opacity .25s; }
  .halte.nu .kaartje, .halte.gekozen .kaartje, .halte:hover .kaartje, .halte:focus-visible .kaartje { opacity: 1; }
  @media (max-width: 700px) { .top { padding: 14px 16px; } }

  /* Wijzer met een hupje bij je volgende level: klik hem zelf aan */
  .wijzer { position: absolute; z-index: 4; transform: translate(-50%, calc(-100% - 24px)); display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .wijzer.aan { opacity: 1; pointer-events: auto; animation: hupje 1.1s ease-in-out infinite; }
  .wijzer-tekst { background: var(--accent); color: #1A1A2E; font: 800 14px 'Barlow', sans-serif; padding: 6px 12px; border-radius: 12px; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .wijzer-pijl { color: var(--accent); font-size: 28px; line-height: 1; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  @keyframes hupje { 0%, 100% { transform: translate(-50%, calc(-100% - 24px)); } 50% { transform: translate(-50%, calc(-100% - 38px)); } }
  @media (prefers-reduced-motion: reduce) { .wijzer.aan { animation: none; } .jij { transition: none; } }
  .volgende-hint { margin-top: 22px; font-size: 18px; color: var(--text); background: rgba(216,254,86,.08); border: 1px dashed rgba(216,254,86,.5); border-radius: 16px; padding: 14px 18px; max-width: 52ch; }
  .volgende-hint b { color: var(--accent); }
  .knop-tweede { display: inline-block; margin-top: 14px; color: var(--text-2); font-weight: 700; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.3); }
  .knop-tweede:hover { color: #fff; }
</style>
</head>
<body>
<div class="top"><span class="logo">MORGEN<em>.</em></span><a href="/files/welkom-v4.html">↺ Bekijk de intro opnieuw</a></div>

<section class="kaart" aria-label="Jouw route">
  <div class="laag" id="laag">
    <img class="plaat" src="/files/start-leeg.png" alt="Een pad door de heuvels met zeven lichtjes, op weg naar een stad met een raket.">
    <img class="jij" id="jij" src="/files/jij-uitgesneden.png" alt="">
    <button class="wijzer" id="wijzer" tabindex="-1" aria-hidden="true"><span class="wijzer-tekst">Je volgende level</span><span class="wijzer-pijl">↓</span></button>
  </div>
</section>

<main class="onder">
  <p class="eyebrow" id="status"></p>
  <h1 class="level-titel" id="titel"></h1>
  <p class="samenvatting" id="samenvatting"></p>
  <p class="mijlpaal" id="mijlpaal"></p>
  <div id="actie"></div>
  <details class="demo"><summary>Demo: zet je voortgang</summary><div class="rij" id="demo-knoppen"></div></details>
</main>
<div class="gevierd" id="gevierd" role="status"></div>

<script>
  const LEVELS = [
    { naam: 'Werkplek', x: 49.9, y: 76.7, jx: 45.5, jy: 85, h: 40, kant: 'rechts', samenvatting: 'Richt je werkplek in: je AI-app, GitHub, je eigen repo en GitHub Desktop.', mijlpaal: 'Je AI werkt in je eigen repo en je eerste wijziging staat online.', knop: 'Begin met je werkplek', pagina: '/files/level0-v7.html' },
    { naam: 'Idee', x: 73.4, y: 69.4, jx: 72.0, jy: 70.6, h: 9, kant: 'links', samenvatting: 'Zet je idee, je visie en een eerste waardepropositie op papier.', mijlpaal: 'Je idee, je visie en een eerste waardepropositie.', knop: 'Ga verder met je idee' },
    { naam: 'Probleem-validatie', x: 83.3, y: 62.0, jx: 82.3, jy: 63.0, h: 6, kant: 'links', samenvatting: 'Bepaal je doelgroep, interview ze echt, en ontdek of ze hetzelfde probleem ervaren.', mijlpaal: 'Een eerste doelgroep die allemaal hetzelfde probleem ervaart.', knop: 'Ga verder met probleem-validatie' },
    { naam: 'Prototype', x: 73.5, y: 55.4, jx: 72.7, jy: 56.2, h: 4.5, kant: 'links', samenvatting: 'Bedenk oplossingen en maak een eerste versie die je kunt laten zien.', mijlpaal: 'Product/solution fit.' },
    { naam: 'Markt feedback', x: 84.6, y: 49.9, jx: 84.0, jy: 50.5, h: 3.6, kant: 'links', samenvatting: 'Laat je eerste versie zien en pas hem aan op wat je hoort.', mijlpaal: 'Commitment om te kopen tegen een prijs.' },
    { naam: 'Product-validatie', x: 89.0, y: 46.1, jx: 88.5, jy: 46.6, h: 3, kant: 'links', samenvatting: 'Bouw een basisproduct waar je eerste klanten fan van zijn.', mijlpaal: 'Product/market fit.' },
    { naam: 'Lancering', x: 84.6, y: 43.1, jx: 84.1, jy: 43.6, h: 2.6, kant: 'links', samenvatting: 'Van je eerste klanten naar een verkoop die je kunt herhalen.', mijlpaal: 'Een herhaalbaar verkoopproces en je eerste klanten.' },
  ];
  const q = new URLSearchParams(location.search);
  let voortgang = Math.min(6, Math.max(0, Number(q.get('voortgang') ?? 0)));
  const van = q.has('van') ? Number(q.get('van')) : null;
  let gekozen = voortgang;

  const laag = document.getElementById('laag');
  const jij = document.getElementById('jij');
  const knoppen = LEVELS.map((l, i) => {
    const b = document.createElement('button');
    b.style.left = l.x + '%'; b.style.top = l.y + '%';
    b.style.setProperty('--d', Math.max(22, 54 - i * 5) + 'px');
    b.innerHTML = `<span class="ring"></span><span class="kaartje ${l.kant}"><span class="nr">${i}</span>${l.naam}<span class="slot"></span></span>`;
    b.addEventListener('click', () => { gekozen = i; if (i === voortgang) verbergWijzer(); teken(); });
    laag.appendChild(b);
    return b;
  });
  const demo = document.getElementById('demo-knoppen');
  const demoKnoppen = LEVELS.map((l, i) => {
    const b = document.createElement('button');
    b.textContent = `${i} ${l.naam}`;
    b.addEventListener('click', () => { voortgang = i; gekozen = i; teken(); });
    demo.appendChild(b);
    return b;
  });

  function zetJij(i) {
    const l = LEVELS[i];
    jij.style.left = l.jx + '%'; jij.style.top = l.jy + '%'; jij.style.height = l.h + '%';
  }

  function teken() {
    knoppen.forEach((b, i) => {
      const staat = i < voortgang ? 'af' : i === voortgang ? 'nu' : 'dicht';
      b.className = `halte ${staat}${i === gekozen ? ' gekozen' : ''}`;
      b.querySelector('.slot').textContent = staat === 'af' ? ' ✓' : staat === 'dicht' ? ' 🔒' : '';
      b.setAttribute('aria-label', `Level ${i}: ${LEVELS[i].naam}, ${staat === 'af' ? 'afgerond' : staat === 'nu' ? 'nu bezig' : 'op slot'}`);
      b.setAttribute('aria-pressed', String(i === gekozen));
    });
    demoKnoppen.forEach((b, i) => b.classList.toggle('aan', i === voortgang));
    zetJij(voortgang);
    const l = LEVELS[gekozen];
    const staat = gekozen < voortgang ? 'Afgerond' : gekozen === voortgang ? 'Nu bezig' : 'Op slot';
    document.getElementById('status').textContent = `Level ${gekozen} · ${staat}`;
    document.getElementById('titel').textContent = l.naam;
    document.getElementById('samenvatting').textContent = l.samenvatting;
    document.getElementById('mijlpaal').textContent = 'Mijlpaal: ' + l.mijlpaal;
    const actie = document.getElementById('actie');
    if (gekozen > voortgang) {
      actie.innerHTML = `<p class="slot-uitleg">🔒 Gaat open zodra je level ${gekozen - 1} hebt afgerond.</p>`;
    } else if (gekozen < voortgang) {
      actie.innerHTML = `<p class="volgende-hint">✓ Afgerond. <b>Klik op de kaart op het lichtje van level ${voortgang}</b> om verder te gaan.</p>`
        + (l.pagina ? `<a class="knop-tweede" href="${l.pagina}">Bekijk dit level opnieuw</a>` : '');
    } else if (l.pagina) {
      actie.innerHTML = `<a class="knop" href="${l.pagina}">${l.knop} →</a>`;
    } else {
      actie.innerHTML = `<span class="knop" aria-disabled="true" style="opacity:.55;cursor:default">${l.knop ?? 'Open dit level'} →</span><p class="slot-uitleg">Dit level is in deze schets nog niet uitgewerkt.</p>`;
    }
  }

  const wijzer = document.getElementById('wijzer');
  function toonWijzer(i) {
    const l = LEVELS[i];
    wijzer.style.left = l.x + '%'; wijzer.style.top = l.y + '%';
    wijzer.classList.add('aan');
    wijzer.onclick = () => knoppen[i].click();
  }
  function verbergWijzer() { wijzer.classList.remove('aan'); }

  // Kom je net van een afgerond level, dan loop je zichtbaar door naar het volgende lichtje.
  // Het volgende level kies je daarna zelf: de wijzer met een hupje laat zien waar.
  if (van !== null && van < voortgang) {
    const eind = voortgang;
    voortgang = van; gekozen = van;
    jij.style.transition = 'none'; teken(); jij.offsetHeight; jij.style.transition = '';
    voortgang = eind; gekozen = van;
    setTimeout(() => {
      teken();
      const g = document.getElementById('gevierd');
      g.textContent = `Level ${van} afgerond. Op naar ${LEVELS[eind].naam.toLowerCase()}!`;
      g.classList.add('aan');
      setTimeout(() => g.classList.remove('aan'), 4200);
      setTimeout(() => toonWijzer(eind), 2300);
    }, 700);
  } else {
    jij.style.transition = 'none'; teken(); jij.offsetHeight; jij.style.transition = '';
  }
</script>
</body>
</html>
